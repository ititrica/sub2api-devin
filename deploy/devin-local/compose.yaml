name: sub2api-devin-local

# Isolated local deployment. Do not combine with another compose file.
services:
  sub2api:
    image: local/sub2api-devin:endfield-20261021-r3
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: endfield-local-20261021-r3
        COMMIT: local-endfield-r3
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9201:8080"
    volumes:
      - app_data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api_devin
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_DBNAME: sub2api_devin
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "20"
      DATABASE_MAX_IDLE_CONNS: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "64"
      REDIS_MIN_IDLE_CONNS: "5"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      GEMINI_CLI_OAUTH_CLIENT_ID: ${GEMINI_CLI_OAUTH_CLIENT_ID:-}
      GEMINI_CLI_OAUTH_CLIENT_SECRET: ${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 6s
      start_period: 120s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:18-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub2api_devin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: sub2api_devin
      PGDATA: /var/lib/postgresql/18/docker
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api_devin -d sub2api_devin && psql -U sub2api_devin -d sub2api_devin -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:8-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app_data:
  postgres_data:
  redis_data:
